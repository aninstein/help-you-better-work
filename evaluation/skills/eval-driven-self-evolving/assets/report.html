<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="report-template" content="eval-driven-self-evolving/1.0">
<title>Duet · 评测与自进化报告</title>
<style>
:root{color-scheme:light;--bg:#eef3f7;--paper:#fff;--ink:#193047;--muted:#526679;--line:#d7e1e9;--blue:#235c9e;--good:#17674c;--bad:#ac3434;--warm:#885b13;--wash:#f6f9fc;--radius:12px}
*{box-sizing:border-box;scrollbar-color:#91a5b7 #edf2f7;scrollbar-width:thin}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}a{color:var(--blue);text-underline-offset:4px}a:hover{text-decoration-thickness:2px}:focus-visible{outline:3px solid var(--blue);outline-offset:4px}button,summary,select{cursor:pointer}button:active{transform:translateY(1px)}button,select{font:inherit;border:1px solid var(--line);border-radius:7px;padding:8px 12px;background:var(--paper);color:var(--ink)}button:hover,select:hover{border-color:var(--blue)}button:disabled{cursor:default;color:var(--muted)}input{font:inherit;border:1px solid var(--line);border-radius:7px;padding:9px 12px;color:var(--ink);background:white;min-width:0}header{background:#203e5b;color:white;border-bottom:5px solid #85afc5}header .inner{max-width:1400px;margin:auto;padding:32px 36px}header p{color:#d1e1ed;margin:8px 0 0}.eyebrow{font:12px/1.4 ui-monospace,SFMono-Regular,monospace;letter-spacing:.12em}h1{font-size:30px;font-weight:650;margin:8px 0;letter-spacing:-.02em}h2{font-size:21px;margin:0 0 16px}h3{font-size:16px;margin:0 0 10px}p{margin:8px 0}main{max-width:1400px;margin:auto;padding:26px 36px 60px}nav{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:26px;font-size:13px}section{scroll-margin-top:20px;margin-bottom:26px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:20px 0;border:1px solid var(--line);border-radius:var(--radius);background:white}.metric{padding:18px 22px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric b{font-size:32px;line-height:1.4;display:block;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.metric span,.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.label{font-size:12px;color:var(--muted)}.tag{display:inline-block;border:1px solid currentColor;border-radius:5px;font-size:12px;padding:1px 8px;font-weight:600;white-space:nowrap}.pass{color:var(--good)}.fail{color:var(--bad)}.warn{color:var(--warm)}.neutral{color:var(--muted)}.banner{border-left:4px solid var(--blue);padding:10px 14px;background:#e6eff8;font-size:13px}.bar{display:grid;grid-template-columns:150px minmax(80px,1fr) 50px;gap:12px;align-items:center;margin:12px 0;font-size:13px}.track{height:9px;border-radius:2px;background:#e5edf5;overflow:hidden}.fill{height:100%;background:var(--blue)}.number{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,monospace;text-align:right}.table-wrap{overflow:auto;scrollbar-gutter:stable}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-weight:500;white-space:nowrap;background:var(--wash)}th,td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}td:first-child,th:first-child{padding-left:0}tr:last-child td{border-bottom:0}caption{text-align:left;margin-bottom:12px;color:var(--muted)}.timeline{border-left:2px solid var(--line);padding-left:24px;margin-left:8px}.round{position:relative;margin:24px 0}.round:before{content:"";position:absolute;left:-31px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid white}.round-heading{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.issue{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.issue:first-child{border:0;padding-top:0}.issue code{overflow-wrap:anywhere}.case{background:white;border:1px solid var(--line);border-radius:var(--radius);margin:12px 0;overflow:hidden}.case>summary{list-style:none;display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:16px;padding:18px 22px;align-items:center}.case>summary:after{content:"展开 +";font-size:12px;color:var(--muted)}.case[open]>summary:after{content:"收起 −"}.case>summary:hover{background:var(--wash)}.case-body{padding:0 22px 22px}.case-meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.checks{margin:12px 0}.checks td:last-child{text-align:right}.code,pre{font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--wash);padding:14px;border:1px solid var(--line);border-radius:6px;max-height:460px;overflow:auto;tab-size:2}.answer{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f6fa;border-left:3px solid #85afc5;padding:16px;font-size:14px;margin:8px 0 18px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0}.search{display:flex;gap:6px;flex:1;min-width:200px}.search input{width:100%}#count{font-size:13px;color:var(--muted)}[hidden]{display:none!important}.empty{padding:25px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:8px}.scope{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}footer{color:var(--muted);font-size:12px;margin-top:32px}.spark{width:100%;height:145px;display:block}.spark text{font:12px ui-monospace,SFMono-Regular,monospace;fill:var(--muted)}.spark .point{fill:var(--blue)}.spark .rejected{fill:white;stroke:var(--bad);stroke-width:2}.spark .line{fill:none;stroke:var(--blue);stroke-width:2}.spark .axis{stroke:var(--line);stroke-width:1}
@media(max-width:760px){main{padding:20px 16px}header .inner{padding:24px 16px}h1{font-size:24px}.metrics{grid-template-columns:1fr 1fr}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}.grid{grid-template-columns:1fr}.panel{padding:18px}.case>summary{padding:16px;grid-template-columns:76px minmax(0,1fr);gap:10px}.case>summary:after{display:none}.case-body{padding:0 16px 16px}.bar{grid-template-columns:120px minmax(40px,1fr) 40px;gap:8px}.toolbar label{font-size:13px}}
@media print{body{background:white}header{color:var(--ink);background:white}header p{color:var(--muted)}main{padding:12px}nav,.toolbar{display:none}.panel,.case{break-inside:avoid}pre{max-height:none}.answer{background:white}.metrics{break-inside:avoid}}
@media(forced-colors:active){.fill{background:Highlight}.tag{border:1px solid CanvasText}}
</style>
</head>
<body>
<header><div class="inner"><div class="eyebrow">DUET / EVALUATION → PROMPT → EVALUATION</div><h1>评测与自进化报告</h1><p>@@META@@</p></div></header>
<main>
<nav aria-label="报告章节"><a href="#overview">评测概览</a><a href="#trend">分数与分布</a><a href="#evolution">自进化轮次</a><a href="#issues">未解决问题</a><a href="#cases">逐题证据</a></nav>
<section id="overview">@@OVERVIEW@@</section>
<section id="trend">@@TREND@@</section>
<section id="evolution" class="panel"><h2>自进化轮次</h2>@@EVOLUTION@@</section>
<section id="issues" class="panel"><h2>未解决与只报告项</h2>@@ISSUES@@</section>
<section id="cases"><h2>逐题输入与返回</h2><p class="muted">@@CASE_NOTE@@ · 自动通过要求该题全部自动检查通过，人工量表待复核。</p>
<div class="toolbar"><div class="search"><input id="query" type="search" aria-label="搜索题号、输入和返回内容" placeholder="搜索题号、输入或返回内容"><button id="clear" type="button" aria-label="清空搜索" hidden>清空</button></div><label for="status">状态</label><select id="status"><option value="all">全部题目</option><option value="fail">未通过 / 错误</option><option value="pass">自动通过</option></select><span id="count" role="status" aria-live="polite"></span></div>
<div id="case-list">@@CASES@@</div><p id="no-results" class="empty" hidden>没有匹配的题目，请清空搜索或调整筛选条件。</p>
</section>
<footer>固定模板 v1.0 · 自包含 HTML，可离线查看 · @@FOOTER@@</footer>
</main>
<script>
const query=document.querySelector('#query'), statusFilter=document.querySelector('#status'), clearButton=document.querySelector('#clear');
const cases=[...document.querySelectorAll('.case')];
const terms=cases.map(item=>item.textContent.toLocaleLowerCase('zh-CN'));
function filter(){const q=query.value.trim().toLocaleLowerCase('zh-CN');let shown=0;cases.forEach((item,index)=>{const match=(!q||terms[index].includes(q))&&(statusFilter.value==='all'||item.dataset.status===statusFilter.value);item.hidden=!match;if(match)shown++});document.querySelector('#count').textContent=`显示 ${shown} / ${cases.length} 题`;document.querySelector('#no-results').hidden=shown>0;clearButton.hidden=!query.value}
query.addEventListener('input',event=>{if(!event.isComposing)filter()});query.addEventListener('compositionend',filter);statusFilter.addEventListener('change',filter);clearButton.addEventListener('click',()=>{query.value='';filter();query.focus()});filter();
</script>
</body></html>
