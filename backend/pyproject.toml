[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dual-ai-voice-backend"
version = "0.1.0"
description = "FastAPI service for the dual-channel voice agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
  "langchain-core>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langchain-ollama>=1.0,<2.0",
  "langgraph>=0.2,<1.0",
  "python-multipart>=0.0.20",
  "python-dotenv>=1,<2",
  "numpy>=1.26,<3",
  "faster-whisper>=1.1,<2.0",
  "av>=13,<17",
  "edge-tts>=7.2,<8",
  "markdown-it-py>=3,<5",
  "httpx>=0.28,<1.0",
  "pyyaml>=6,<7",
  "sherpa-onnx==1.13.8",
  "onnxruntime>=1.16,<2",
  "transformers==4.57.6",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
